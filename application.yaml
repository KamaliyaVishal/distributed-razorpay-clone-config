spring:

  # Virtual thread Configurations
  threads:
    virtual:
      enabled: true
  
  # PostgresSQL Database Connection Settings
  datasource:
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  
  # JPA / Hibernate Configurations
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        #format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  # Redis Configurations
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka Configurations
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: razorpay-clone-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.*"

# Eureka server Configurations
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost

# Actuator Configurations
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# Logging Configurations
logging:
  level:
    org.apache.kafka.clients: WARN
    org.apache.kafka.common: WARN

app:
# Kafka topics Configurations
  kafka:
    topics:
      payment: payments.events
      order: orders.events
      refund: refunds.events
      settlement: settlements.events

# jwt topics Configurations
  jwt:
    secret-key: JWBq9AucykfpPXuwGELWOH3VG0sOOzso6IjAUG4jyIf