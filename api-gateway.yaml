server:
  port: 8080

app:
  security:
    trust-inbound-headers: false
    public-routes:
      - "/api/v1/auth/**"
      - "/webhook/**"
      - "/actuator/**"

  # Rate-Limiter configuration    
  rate-limit:
    method: fixed # Options: "fixed", "sliding", "sliding-lua", or "bucket"
    use-case:
      api-key:
        requests-per-minute: 60

# Routes configuration    
spring.cloud.gateway.server.webmvc:
  routes:
    - id: merchant-service
      uri: lb://merchant-service
      predicates:
        - Path=/api/v1/auth/**, /api/v1/merchants/**

    - id: payment-service
      uri: lb://payment-service
      predicates:
        - Path=/api/v1/orders/**, /api/v1/payments/**

    - id: vault-service
      uri: lb://vault-service
      predicates:
        - Path=/api/v1/vault/**

    - id: operations-service
      uri: lb://operations-service
      predicates:
        - Path=/webhook/**

---

# --- indicates the start of a new YAML document (enables multi-document files)
# This configuration will used when K8S profile is active

spring:
  config:
    activate:
      on-profile: k8s

jwt:
  secret-key: ${JWT_SECRET}